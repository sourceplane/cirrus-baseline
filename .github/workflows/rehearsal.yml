name: Rehearsal

# TIER 3: THE BOOTSTRAP THIS BASELINE HAS NEVER RUN (BE6b).
#
# Builds a throwaway product from the PUBLISHED baseline into a dedicated
# Cloudflare account, asserts it came up, records what it cost, and destroys
# it. Everything it does lives in `testing/rehearsal/` as an orun component
# with its own intent and its own repo-local stack — so this file is two
# commands and a schedule, and the thing being reviewed is the component.
#
# ─── NEVER ON A PULL REQUEST ────────────────────────────────────────────
#
# Not a cost decision, a credential one. This repository's CI OIDC exchange
# is refused for `pull_request` BY DESIGN — a PR must never obtain deploy or
# state credentials — so the secrets a rehearsal needs cannot resolve there
# and the lane would die before the first test body, which is exactly how
# `tests/flows` managed never to fail a pull request. On main and on demand,
# where the identity is real.
#
# ─── WHY THE SECRETS ARE NOT HERE ───────────────────────────────────────
#
# There are no `secrets.*` in this file beyond the GitHub token Actions
# issues itself. The rehearsal's three credentials are orun-managed and
# declared on the component: resolved lease-bound at claim time, redacted
# from logs, revocable without a commit. See testing/rehearsal/component.yaml.

on:
  schedule:
    # 03:00 UTC. Nothing else in this repository runs then, and a rehearsal
    # that collides with a convergence run competes for the same runner pool.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      workspace:
        description: "Rehearsal workspace (ws_…). Overrides the repository variable."
        required: false
        type: string

# ONE AT A TIME, AND NEVER CANCELLED. Two rehearsals in one Cloudflare
# account race on resource names; a cancelled one leaves everything it had
# created, because the teardown step never runs.
concurrency:
  group: baseline-rehearsal
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ORUN_REHEARSAL_WORKSPACE: ${{ inputs.workspace || vars.ORUN_REHEARSAL_WORKSPACE }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: sourceplane/orun-action@v1.2.0
        with:
          # The floor `baseline new --local` arrived in. The COMPONENT pins
          # the version its own job installs; this one only has to be new
          # enough to plan and run.
          version: v2.58.11

      # Fail here, not an hour in. A workspace that is empty means the
      # repository variable was never set, and the component's own guard
      # would catch it — but only after the runner had been claimed and the
      # lane had looked alive for a minute.
      - name: the workspace must be named
        run: |
          set -euo pipefail
          # Not `${VAR:?message}`: bash reads a single quote inside the word of
          # that expansion as the start of a quoted string even under double
          # quotes, and this step died with "unexpected EOF while looking for
          # matching `''" on every nightly before the first `orun` call — which
          # is how the variable being unset went unreported for a week.
          if [ -z "$ORUN_REHEARSAL_WORKSPACE" ]; then
            echo "✕ set the ORUN_REHEARSAL_WORKSPACE repository variable: a ws_… id for the REHEARSAL workspace, never a product's" >&2
            exit 1
          fi
          case "$ORUN_REHEARSAL_WORKSPACE" in
            ws_*) ;;
            *) echo "✕ ORUN_REHEARSAL_WORKSPACE is '$ORUN_REHEARSAL_WORKSPACE', which is not a ws_… id" >&2; exit 1 ;;
          esac

      - name: plan the rehearsal
        run: |
          set -euo pipefail
          orun plan -i testing/rehearsal/intent.yaml --output rehearsal.json
          jq -r '.jobs[] | "  " + .checkName' rehearsal.json

      - name: run it
        run: orun run --plan rehearsal.json --runner github-actions --remote-state

      # The measurements half of BE6's done-when. Kept as an artifact rather
      # than committed: a number that writes itself into TIMINGS.md is a
      # number nobody read, and that file's whole point is that an estimate
      # surviving its first real run unchanged means nobody checked.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rehearsal-timings
          path: |
            rehearsal.json
          if-no-files-found: warn
