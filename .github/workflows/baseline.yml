name: Baseline CI

# THE FACTORY'S OWN LANES — tiers 0 to 2 (saas-bootstrap-engine BE5, BE6).
#
# These test the BASELINE: that its build document parses with the orun a
# bootstrap actually runs, that every component it ships is placed by exactly
# one phase, that a placed tree comes up branded and answering, and that a
# product carries nothing it should not.
#
# ─── WHY THIS IS NOT IN ci.yml ──────────────────────────────────────────
#
# `repo-blueprint.yaml`'s `github-workflows` module copies the WHOLE `.github`
# directory, so every workflow here travels into every product built from this
# repository. These jobs run `testing/*.sh`, and `testing/` is deliberately not
# placed — so in a product they are four steps that cannot pass, red on its
# very first pull request, in a repository whose owner has no idea what a
# "blueprint" is.
#
# They were in `ci.yml` and did exactly that. Nobody had seen it because no
# product has been bootstrapped from this baseline yet — which is the gap BE6
# exists to close, and this is the first thing closing it found.
#
# `ci.yml` keeps `plan` and `run`: those are the orun component lanes, and a
# product genuinely needs them.
#
# The split is enforced, not remembered: `testing/coverage.test.sh` fails on
# any workflow that reads a path under `testing/` and is not in the blueprint's
# `ignore` list.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: baseline-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

jobs:
  # The baseline's contract suite, run directly rather than through a
  # component. It used to ride a `tests/flows` component, which BE4 retired,
  # and there were two reasons it did not belong there even then:
  #
  #   1. That component's `quick-check` profile runs setup, install and a
  #      package-structure check — and no tests. Observed live: the lane went
  #      green having executed `4 passed, 0 failed` steps, none of which was a
  #      test. Every turbo-package component in the repo uses that profile, so
  #      this was not a mis-set component; changing it is a guess at a
  #      composition published as an OCI artifact and not readable from here.
  #   2. These scripts need bash, python3 and git and nothing else — no
  #      workspace install, no network, no credential. A 20-second job that
  #      certainly fails a pull request beats a two-minute one that certainly
  #      does not.
  #
  # THIS is the job that makes the suite able to fail a PR.
  baseline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Contract tests (manifest, phases, coverage, teardown, tag-gate, rebrand, retouch)
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          for t in manifest phases coverage teardown tag-gate rebrand retouch; do
            echo "── $t"
            bash "testing/$t.test.sh"
          done

  # THE BLUEPRINT PARSES WITH THE BINARY A BOOTSTRAP ACTUALLY RUNS.
  #
  # This job exists because its absence let a real regression reach main. BE1
  # rewrote `repo-blueprint.yaml` to orun's phase overlay and repointed every
  # flow at `orun new --blueprint repo-blueprint.yaml --phase <name>`. It was
  # verified against an orun built from that repo's main — and no released orun
  # could read a word of it:
  #
  #     ✕ unknown flag: --phase
  #     ✕ parse blueprint: yaml: unmarshal errors:
  #         line 613: cannot unmarshal !!map into []scaffold.Hook
  #
  # Every test in this repo passed. They all read the YAML with PyYAML, which
  # will parse anything well-formed; not one of them asked the question that
  # matters, which is whether the CLI at the PINNED VERSION can read it.
  #
  # So this job pins the same version the bootstrap does and makes orun itself
  # answer. `--status` derives every phase's state: it parses the document,
  # validates each phase's hooks against the action registry, compiles every
  # `when` and every narration template, and writes nothing. It does not probe
  # — derivation asks the tree, not the network — so it needs no credential.
  blueprint-parses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: sourceplane/orun-action@v1.2.0
        with:
          # The bootstrap floor (BOOTSTRAP.md), not the product lane pin: the
          # blueprint's `orun.run/watch@v1` `sha:` exists from v2.58.5, and an
          # older CLI refuses the whole document at parse; v2.58.6 is where a
          # landing's check wait covers the whole PR run; v2.58.7 knows
          # orun.doctor/check@v1's `githubOwner`; v2.58.8 reads
          # orun.secrets/exists@v1's `environments`; v2.58.10 defers a probe
          # about a project the bootstrap has not created yet; v2.58.11 fills
          # an input declared `from: workspace`.
          version: v2.58.11
      - name: repo-blueprint.yaml, read by the pinned CLI
        run: |
          set -euo pipefail
          orun --version
          # Inputs that are `required: true` must be supplied for the document
          # to resolve; the values are arbitrary and nothing is written.
          orun new --blueprint repo-blueprint.yaml --status \
            --out "$(mktemp -d)" \
            --set reponame=acme-cloud \
            --set "productname=Acme Cloud" \
            --set productdomain=acme.dev \
            --set githuborg=acme-inc
      # Tier 1's leak gate. It derives what every phase WOULD place and gates
      # that set — so it needs orun, which is why it rides this job rather than
      # the bash-only one above.
      - name: the leak gate — what a product carries
        run: bash testing/leak.test.sh
      # Tier 1's other half (BE5b). This one PLACES the tree, brands it exactly
      # as 01-scaffold's hooks do, and runs the phases that follow — which is
      # the step nothing here had ever taken, and where orun BE-O12's two
      # defects lived. It needs node for rebrand alongside orun, and about ten
      # seconds. Still offline: placement writes files, and since BE-O12 a run
      # with hooks off does not probe.
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Tier 1 — the tree is placed, branded, and made to answer
        run: bash testing/placement.test.sh
