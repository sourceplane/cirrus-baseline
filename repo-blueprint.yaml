apiVersion: orun.dev/v1
kind: Blueprint
metadata:
  name: cirrus-baseline
  description: >-
    Cirrus as a Blueprint of itself — instantiate a new Cloudflare-only
    multi-tenant SaaS repo from the Cirrus baseline. This is the unified
    replacement for tooling/fork/components.mjs (its prerequisite graph + copy
    ordering now live in orun's own DAG over the declared dependsOn edges below)
    and tooling/rebrand/rebrand.mjs (its instance-identity rename map is declared
    as the `rebrand` hook + the templated rebrand-values file). See BOOTSTRAP.md
    for the operator checklist no script can perform (cloud accounts, secrets,
    OAuth/GitHub apps).

# ── INPUTS ────────────────────────────────────────────────────────────────
# The instance-identity contract, transcribed from tooling/rebrand/rebrand.mjs.
# These feed the templated .rebrand/values.json that the `rebrand` hook applies
# across the copied tree. Org-owned identity (GitHub org `sourceplane`, the orun
# state backend, `sourceplane.io` apiVersion, company mailboxes) is intentionally
# NOT an input — rebrand.mjs protects it.
inputs:
  reponame:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    required: true
    description: Repo slug (e.g. acme-cloud) — intent metadata.name, D1 database names, worker resource prefixes.
  productname:
    type: string
    required: true
    description: Human display name (e.g. "Acme Cloud").
  productdomain:
    type: string
    required: true
    description: Product domain (e.g. acme.dev) — BASE_DOMAIN, console custom domains, OAuth origins.
  pascalName:
    type: string
    default: ""
    description: SDK class identifier (default derived from productname by rebrand.mjs).
  brandSlug:
    type: string
    default: ""
    description: Cloudflare worker resource prefix (default reponame).
  cliBin:
    type: string
    default: ""
    description: CLI binary name + env-var prefix source (default reponame).
  apibaseurl:
    type: string
    default: ""
    description: CLI default API base (default https://api.<productdomain>).
  subdomain:
    type: string
    default: "your-workers-subdomain"
    description: workers.dev subdomain for app-config seams.
  salesEmail:
    type: string
    default: ""
    description: Optional sales mailbox retarget; empty keeps the baseline mailbox.
  orunWorkspace:
    type: string
    default: ""
    # Unset, it is the workspace the build runs in (ORUN_WORKSPACE — which a
    # console build's sandbox always sets, and which the console form cannot
    # send). A value set on the command line or recorded by the tree wins.
    from: workspace
    description: >-
      Orun Cloud workspace ID (ws_…, org_… or slug) for this instance's remote
      state. rebrand.mjs treats the orun state backend as org-owned and leaves
      it alone, so without this the fork inherits the BASELINE's workspace and
      its CI would claim another tenant's workspace. Unset, it is the workspace
      the build runs in; with none anywhere, the scaffold writes a placeholder
      that fails loudly rather than silently cross-tenanting.
  # ── BE1: the three facts the phases below need and the flows used to hold.
  # They were workflow inputs (`githuborg`, `epicslug`, `domain` on
  # the flows' per-phase workflow.yaml), which made them invisible to anything
  # reading this file — including the console that has to render a form.
  githuborg:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9-]*$"
    required: true
    description: GitHub org or user the product repo is created under.
  epicSlug:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    default: infra-baselining
    description: >-
      The epic this bootstrap tracks itself under. Every phase clubs its task
      here, so a run that starts fresh and a run that resumes find the same
      work — the epic is found by slug, which is why this is an input and not
      a generated id.
  repoPrivate:
    type: boolean
    default: true
    description: >-
      Whether the product repository is created private. Private is the safe
      default — a product repo born public is a decision nobody made, and it
      cannot be un-made retroactively for anything already pushed. It was
      hard-coded until now, which meant a baseline could not instantiate the
      open-source product it was asked for without editing the blueprint.
      `orun.repo/ensure@v1` only sets this at creation: an existing repository
      keeps whatever visibility it already has.
  domain:
    type: boolean
    default: false
    description: >-
      Whether to wire the product's custom domain (phase 07). It needs the
      Cloudflare zone to already exist, so it is off unless asked for — the
      condition the umbrella carried as a shell `[ = "true" ]` test and phase
      07 now carries as its own `when:`.

# ── SOURCES ───────────────────────────────────────────────────────────────
# The baseline is this repo itself. Run `orun new` from the Cirrus repo root so
# `path: .` resolves to the baseline; orun pins it by digest into the object
# store before any module reads it, so a fork is reproducible + provenanced.
sources:
  - name: baseline
    kind: dir
    path: .

# Derived build output the baseline must never carry into a fork (the same set
# tooling/fork/components.mjs skips). Declared here so orun's core stays
# ecosystem-neutral — it excludes exactly what the blueprint names, nothing more.
ignore:
  - dist
  - coverage
  - .turbo
  - .next
  - .wrangler
  - .open-next
  # Locally-rendered, gitignored artifacts. `orun new` snapshots the working
  # tree, not the git index, so without these it copies whatever the operator
  # happens to have built — and a fork would ship with the BASELINE's rendered
  # config baked in.
  #
  # For the TEMPLATED workers, wrangler.jsonc is rendered from
  # wrangler.template.jsonc at deploy time and carries resolved values
  # (baseline domains, and per BF6 the deploy-time binding IDs that must never
  # be committed) — those renders are ignored EXPLICITLY, per app. The two
  # legacy non-templated workers (policy-worker, web-console-next) COMMIT
  # their wrangler.jsonc as the real config; a global ignore silently dropped
  # them from forks (their verify lanes then failed `test -f`), which is why
  # this list names paths instead of a pattern.
  - "**/apps/admin-worker/wrangler.jsonc"
  - "**/apps/api-edge/wrangler.jsonc"
  - "**/apps/billing-worker/wrangler.jsonc"
  - "**/apps/config-worker/wrangler.jsonc"
  - "**/apps/events-worker/wrangler.jsonc"
  - "**/apps/identity-worker/wrangler.jsonc"
  - "**/apps/integrations-worker/wrangler.jsonc"
  - "**/apps/membership-worker/wrangler.jsonc"
  - "**/apps/metering-worker/wrangler.jsonc"
  - "**/apps/notifications-worker/wrangler.jsonc"
  - "**/apps/projects-worker/wrangler.jsonc"
  - "**/apps/webhooks-worker/wrangler.jsonc"
  - "*.tsbuildinfo"

  # THE BASELINE'S OWN CI, which is not a product's (BE6).
  #
  # `github-workflows` copies the whole `.github` directory, so anything added
  # there ships into every product built from this repository. These two run
  # the FACTORY rather than the product, and both read paths under `testing/`
  # that no product is placed with:
  #
  #   rehearsal.yml  tier 3 — bootstraps a throwaway product nightly. Shipped,
  #                  a fresh product repo gets a scheduled workflow that fails
  #                  every night on a `testing/rehearsal/intent.yaml` it does
  #                  not have. (It WAS shipping: BE6b added the workflow and
  #                  kept `testing/rehearsal/` baseline-only, which stopped the
  #                  component travelling and not the lane that runs it.)
  #   tag.yml        cuts `baseline-vN` tags for THIS repository. A product has
  #                  no baseline tags and nothing to gate.
  #   baseline.yml   tiers 0-2 — the factory's own lanes. These were inside
  #                  `ci.yml` and therefore inside every product, where their
  #                  four steps are red on the first pull request. `ci.yml`
  #                  keeps `plan` and `run`, which a product needs.
  #
  # `testing/coverage.test.sh` keeps this list honest: a workflow that reads a
  # path under `testing/` must be named here, or the gate is red.
  - "**/.github/workflows/rehearsal.yml"
  - "**/.github/workflows/tag.yml"
  - "**/.github/workflows/baseline.yml"

# ── MODULES ───────────────────────────────────────────────────────────────
# One module per component (mode: copy), with dependsOn edges TRANSCRIBED from
# what tooling/fork/components.mjs sniffed (declared dependsOn + wrangler service
# bindings + wiringComponents + workspace package deps + tests-follow-subject).
# orun orders them with its own DAG — the ordering that JS reimplementation is
# retired.
#
# Foundation libraries (packages/{contracts,sdk,db,policy-engine}) are copied so
# the fork is a self-contained workspace. To instead consume them as pinned
# shared packages (the SaaS-factory model, design §4), switch those four modules
# to `mode: consume` and drop their `to:` — they then participate in ordering and
# provenance but emit no bytes.
modules:
  - name: admin-worker
    mode: copy
    source: baseline
    from: apps/admin-worker
    to: apps/admin-worker
    dependsOn: [cloudflare-d1, contracts, db]
  - name: admin-worker-tests
    mode: copy
    source: baseline
    from: tests/admin-worker
    to: tests/admin-worker
    dependsOn: [admin-worker, contracts, db]
  - name: api-edge
    mode: copy
    source: baseline
    from: apps/api-edge
    to: apps/api-edge
    dependsOn: [billing-worker, cloudflare-d1, cloudflare-kv, config-worker, contracts, db, events-worker, identity-worker, integrations-worker, membership-worker, metering-worker, notifications-worker, projects-worker, webhooks-worker]
  - name: api-edge-tests
    mode: copy
    source: baseline
    from: tests/api-edge
    to: tests/api-edge
    dependsOn: [api-edge, contracts, db]
  - name: billing-worker
    mode: copy
    source: baseline
    from: apps/billing-worker
    to: apps/billing-worker
    dependsOn: [cloudflare-d1, contracts, db, policy-worker]
  - name: billing-worker-tests
    mode: copy
    source: baseline
    from: tests/billing-worker
    to: tests/billing-worker
    dependsOn: [billing-worker, contracts, db]
  - name: cli
    mode: copy
    source: baseline
    from: packages/cli
    to: packages/cli
    dependsOn: [sdk, webhook-verifier]
  - name: cloudflare-domain
    mode: copy
    source: baseline
    from: infra/terraform/cloudflare-domain
    to: infra/terraform/cloudflare-domain
    dependsOn: [web-console-next]
  - name: cloudflare-d1
    mode: copy
    source: baseline
    from: infra/terraform/cloudflare-d1
    to: infra/terraform/cloudflare-d1
  - name: cloudflare-kv
    mode: copy
    source: baseline
    from: infra/terraform/cloudflare-kv
    to: infra/terraform/cloudflare-kv
  - name: config-worker
    mode: copy
    source: baseline
    from: apps/config-worker
    to: apps/config-worker
    dependsOn: [cloudflare-d1, contracts, db, membership-worker, policy-worker]
  - name: config-worker-tests
    mode: copy
    source: baseline
    from: tests/config-worker
    to: tests/config-worker
    dependsOn: [config-worker, contracts, db]
  - name: contracts
    mode: copy
    source: baseline
    from: packages/contracts
    to: packages/contracts
  - name: contracts-tests
    mode: copy
    source: baseline
    from: tests/contracts
    to: tests/contracts
    dependsOn: [contracts, testing]
  - name: db
    mode: copy
    source: baseline
    from: packages/db
    to: packages/db
  - name: db-migrate
    mode: copy
    source: baseline
    from: infra/db-migrate
    to: infra/db-migrate
    dependsOn: [cloudflare-d1, db]
  - name: db-tests
    mode: copy
    source: baseline
    from: tests/db
    to: tests/db
    dependsOn: [db]
  - name: events-worker
    mode: copy
    source: baseline
    from: apps/events-worker
    to: apps/events-worker
    dependsOn: [cloudflare-d1, contracts, db, membership-worker, policy-worker]
  - name: identity-worker
    mode: copy
    source: baseline
    from: apps/identity-worker
    to: apps/identity-worker
    dependsOn: [cloudflare-d1, contracts, db, membership-worker, notifications-client, notifications-worker, policy-worker]
  - name: identity-worker-tests
    mode: copy
    source: baseline
    from: tests/identity-worker
    to: tests/identity-worker
    dependsOn: [contracts, db, identity-worker, notifications-client]
  - name: integrations-worker
    mode: copy
    source: baseline
    from: apps/integrations-worker
    to: apps/integrations-worker
    dependsOn: [billing-worker, cloudflare-d1, contracts, db, membership-worker, policy-worker, projects-worker]
  - name: integrations-worker-tests
    mode: copy
    source: baseline
    from: tests/integrations-worker
    to: tests/integrations-worker
    dependsOn: [contracts, db, integrations-worker]
  - name: membership-worker
    mode: copy
    source: baseline
    from: apps/membership-worker
    to: apps/membership-worker
    dependsOn: [billing-worker, cloudflare-d1, contracts, db, notifications-client, policy-worker]
  - name: membership-worker-tests
    mode: copy
    source: baseline
    from: tests/membership-worker
    to: tests/membership-worker
    dependsOn: [contracts, db, membership-worker]
  - name: metering-worker
    mode: copy
    source: baseline
    from: apps/metering-worker
    to: apps/metering-worker
    dependsOn: [cloudflare-d1, contracts, db, membership-worker, policy-worker]
  - name: metering-worker-tests
    mode: copy
    source: baseline
    from: tests/metering-worker
    to: tests/metering-worker
    dependsOn: [contracts, db, metering-worker]
  - name: notifications-client
    mode: copy
    source: baseline
    from: packages/notifications-client
    to: packages/notifications-client
    dependsOn: [contracts]
  - name: notifications-client-tests
    mode: copy
    source: baseline
    from: tests/notifications-client
    to: tests/notifications-client
    dependsOn: [contracts, notifications-client]
  - name: notifications-worker
    mode: copy
    source: baseline
    from: apps/notifications-worker
    to: apps/notifications-worker
    dependsOn: [cloudflare-d1, contracts, db, db-migrate, events-worker]
  - name: notifications-worker-tests
    mode: copy
    source: baseline
    from: tests/notifications-worker
    to: tests/notifications-worker
    dependsOn: [contracts, db, notifications-worker]
  - name: policy-engine
    mode: copy
    source: baseline
    from: packages/policy-engine
    to: packages/policy-engine
    dependsOn: [contracts]
  - name: policy-engine-tests
    mode: copy
    source: baseline
    from: tests/policy-engine
    to: tests/policy-engine
    dependsOn: [contracts, policy-engine]
  - name: policy-worker
    mode: copy
    source: baseline
    from: apps/policy-worker
    to: apps/policy-worker
    dependsOn: [contracts, policy-engine]
  - name: policy-worker-tests
    mode: copy
    source: baseline
    from: tests/policy-worker
    to: tests/policy-worker
    dependsOn: [contracts, policy-engine, policy-worker]
  - name: projects-worker
    mode: copy
    source: baseline
    from: apps/projects-worker
    to: apps/projects-worker
    dependsOn: [billing-worker, cloudflare-d1, contracts, db, membership-worker, policy-worker]
  - name: projects-worker-tests
    mode: copy
    source: baseline
    from: tests/projects-worker
    to: tests/projects-worker
    dependsOn: [contracts, db, projects-worker]
  - name: sdk
    mode: copy
    source: baseline
    from: packages/sdk
    to: packages/sdk
    dependsOn: [contracts]
  # No dependsOn. It carried `[bootstrap]` until BE1 — a module that does not
  # exist and never has, so orun would have refused this document
  # (`dependsOn unknown module`). split-phases.py pruned every cross-phase
  # edge to make each slice parse, and a pruned edge to a module in NO phase
  # is indistinguishable from a pruned edge to one in an earlier phase, so
  # the defect survived every run. packages/shared's only workspace deps are
  # @saas/eslint-config and @saas/tsconfig, which this blueprint does not
  # declare as edges for any package (see `contracts`, which has the same two
  # and no dependsOn).
  - name: shared
    mode: copy
    source: baseline
    from: packages/shared
    to: packages/shared
  - name: testing
    mode: copy
    source: baseline
    from: packages/testing
    to: packages/testing
    dependsOn: [contracts, db]
  - name: web-console-next
    mode: copy
    source: baseline
    from: apps/web-console-next
    to: apps/web-console-next
    dependsOn: [api-edge, contracts, sdk]
  - name: web-console-next-tests
    mode: copy
    source: baseline
    from: tests/web-console-next
    to: tests/web-console-next
    dependsOn: [contracts, web-console-next]
  - name: webhook-verifier
    mode: copy
    source: baseline
    from: packages/webhook-verifier
    to: packages/webhook-verifier
  - name: webhooks-worker
    mode: copy
    source: baseline
    from: apps/webhooks-worker
    to: apps/webhooks-worker
    dependsOn: [cloudflare-d1, contracts, db, membership-worker, policy-worker]

  # ── Component-less workspace test packages (no component.yaml; ride their
  #    subject per the tests-follow-subject rule in components.mjs). ──────────
  - name: events-worker-tests
    mode: copy
    source: baseline
    from: tests/events-worker
    to: tests/events-worker
    dependsOn: [events-worker]
  - name: webhooks-worker-tests
    mode: copy
    source: baseline
    from: tests/webhooks-worker
    to: tests/webhooks-worker
    dependsOn: [webhooks-worker]

  # ── Non-component workspace scaffolding (copied verbatim). ─────────────────
  #
  # There is deliberately NO composition-stack module. The execution contracts
  # are not vendored: `intent.yaml` (copied below) declares
  #   kind: oci → oci://ghcr.io/sourceplane/stack-tectonic:<version>
  # so an instantiated repo resolves the SAME published catalog the baseline
  # does, pinned to the same version, with nothing to drift. Composition changes
  # are made in sourceplane/stack-tectonic, released there, and adopted by
  # bumping the pinned tag — in the fork exactly as in the baseline.
  # Only the tooling a PRODUCT runs: shared TS/ESLint config and the
  # deploy-time wrangler renderer. The baseline's own machinery (rebrand,
  # blueprint split, bootstrap helpers, migration tools) stays in the
  # baseline — a product is a product, not a copy of the factory.
  - name: tooling-eslint
    mode: copy
    source: baseline
    from: tooling/eslint
    to: tooling/eslint
  - name: tooling-tsconfig
    mode: copy
    source: baseline
    from: tooling/tsconfig
    to: tooling/tsconfig
  - name: tooling-wire
    mode: copy
    source: baseline
    from: tooling/wire
    to: tooling/wire
  # The product's own context pack (operating contract + live-deployment
  # manifest), not the baseline's planning state.
  # ── The product's own context pack, FILE BY FILE (BE5's leak gate).
  #
  # This was `from: ai/context` — the whole directory — and the directory holds
  # this repository's own planning state. Every product shipped with cirrus's
  # `current.md`, `decisions.md` and `open-risks.md`, and with
  # `fork-from-baseline.md`, which opens:
  #
  #     # Provenance — Cirrus from the Lumen baseline
  #
  # After rebrand that becomes a sentence about the CUSTOMER's product, saying
  # it was forked from Lumen at a commit the customer has never seen. Not a
  # leak of a secret — a leak of a false statement, written in the product's
  # own voice, in the file an agent is pointed at first.
  #
  # There is no file list on a copy module, so one module per file. That is the
  # feature, not the workaround: adding a file to `ai/context/` can no longer
  # ship it by accident, because shipping it means writing a module and saying
  # in a diff that a product should have it.
  - name: ai-deployment
    mode: copy
    source: baseline
    from: ai/context/deployment.md
    to: ai/context/deployment.md
  - name: ai-operations
    mode: copy
    source: baseline
    from: ai/context/operations.md
    to: ai/context/operations.md
  - name: github-workflows
    mode: copy
    source: baseline
    from: .github
    to: .github
  - name: vscode
    mode: copy
    source: baseline
    from: .vscode
    to: .vscode

  # ── Root files (single-file copies). intent.yaml, package.json et al. carry
  #    instance identity; they are copied verbatim and rewritten in place by the
  #    `rebrand` hook (its rename map is the authority, not a per-file template).
  - name: root-intent
    mode: copy
    source: baseline
    from: intent.yaml
    to: intent.yaml
  - name: root-package-json
    mode: copy
    source: baseline
    from: package.json
    to: package.json
  - name: root-pnpm-workspace
    mode: copy
    source: baseline
    from: pnpm-workspace.yaml
    to: pnpm-workspace.yaml
  - name: root-pnpm-lock
    mode: copy
    source: baseline
    from: pnpm-lock.yaml
    to: pnpm-lock.yaml
  - name: root-turbo
    mode: copy
    source: baseline
    from: turbo.json
    to: turbo.json
  - name: root-kiox
    mode: copy
    source: baseline
    from: kiox.yaml
    to: kiox.yaml
  - name: root-kiox-lock
    mode: copy
    source: baseline
    from: kiox.lock
    to: kiox.lock
  - name: root-gitignore
    mode: copy
    source: baseline
    from: .gitignore
    to: .gitignore
  - name: root-readme
    mode: copy
    source: baseline
    from: README.md
    to: README.md

  # ── The empty discovery roots, declared (BE1).
  #    orun's repo-scale gate — and later `orun plan` in the product's own CI —
  #    discovers apps/, infra/, packages/ and tests/, which by design are empty
  #    until later phases fill them. A missing root is a hard gate failure, so
  #    the scaffold flow created them with a mkdir and a
  #    touch immediately before calling `orun new`. That is a file the tree
  #    needs in order to be valid, which is what a module is for: shell that
  #    creates a required file is a module nobody wrote down.
  - name: discovery-roots
    mode: template
    files:
      apps/.gitkeep: ""
      infra/.gitkeep: ""
      packages/.gitkeep: ""
      tests/.gitkeep: ""

  # ── Instance-identity values file (template) — consumed by the rebrand hook.
  #    This is the only place blueprint inputs touch the tree at scaffold time;
  #    everything else is a verbatim copy the hook rewrites.
  #
  #    It is also how a LATER phase recovers what the operator answered. orun
  #    records the non-secret inputs in .orun/provenance.lock, but `.orun/` is
  #    gitignored in the product, so it has never survived a container — this
  #    file is committed, which is why every input a later phase needs must
  #    appear here. githuborg/epicSlug/domain are here for exactly that: a
  #    phase run months later in a fresh container reads them back.
  - name: rebrand-values
    mode: template
    files:
      ".rebrand/values.json": |
        {
          "reponame": "{{ .reponame }}",
          "productname": "{{ .productname }}",
          "productdomain": "{{ .productdomain }}"{{ if .pascalName }},
          "pascalName": "{{ .pascalName }}"{{ end }}{{ if .brandSlug }},
          "brandSlug": "{{ .brandSlug }}"{{ end }}{{ if .cliBin }},
          "cliBin": "{{ .cliBin }}"{{ end }}{{ if .apibaseurl }},
          "apibaseurl": "{{ .apibaseurl }}"{{ end }},
          "subdomain": "{{ .subdomain }}"{{ if .salesEmail }},
          "salesEmail": "{{ .salesEmail }}"{{ end }},
          "orunWorkspace": "{{ .orunWorkspace }}",
          "githuborg": "{{ .githuborg }}",
          "epicSlug": "{{ .epicSlug }}",
          "domain": {{ if .domain }}true{{ else }}false{{ end }}
        }

# ── THE WORK, UP FRONT ────────────────────────────────────────────────────
# THE BOOTSTRAP IS WORK, SO IT LIVES WHERE WORK LIVES — and all of it is on
# the plane before the first phase places a file. One epic, one milestone
# per phase in the order the phases run, one task per landing: the whole
# programme a reader can open while 01-scaffold is still creating the
# repository, instead of a row appearing each time a phase was reached.
#
# `hooks.preInstantiate` (orun >= v2.60) runs under no phase, once per run,
# on a resume too. Everything here is find-or-create BY IDENTITY — the epic
# by slug, a milestone by name within its epic, a task by title within its
# epic — so a second run, a resume and a redo all find what the first run
# made. That is also why the milestones are created here IN ORDER and BEFORE
# the tasks: the plane appends each new milestone after the last, and a task
# that names a milestone the epic does not yet have would create it out of
# order at the end.
#
# Each phase's own `pre` hook still runs `orun.task/ensure@v1` on its task.
# That is the same identity, so it finds rather than creates, and it is how
# the phase gets the task's KEY for its landing — `{{ .phase.name }}` renders
# empty here, and the outputs of a run-level hook are not a phase's to read.
#
# Names, not phase ids. A task title is what a person reads in the work
# surface, so it is an imperative sentence about the outcome; the pull
# request that lands it carries a conventional-commit title of its own. The
# MILESTONE keeps the phase's name (`04-workers`): it is the identity the
# engine's phase events, the plane's evidence and the console's rows all
# meet on, and the card's `programme.milestones` names the same list.
hooks:
  preInstantiate:
    - id: epic
      uses: orun.task/ensure@v1
      with:
        kind: epic
        slug: "{{ .inputs.epicSlug }}"
        name: "Infra baselining — {{ .inputs.productname }}"
        description: >-
          Everything the Cirrus baseline builds for {{ .inputs.productname }}
          in {{ .inputs.githuborg }}/{{ .inputs.reponame }}: the repository,
          the shared packages, the D1 and KV data plane, the twelve-worker
          fleet, the API edge, the web console, the custom domain when one is
          asked for, and the record of what went live. One milestone per
          phase, in the order the phases run; one task per landing, each
          bound to the pull request that lands it.
        owner: me
    # Milestones, in phase order. `exitCriteria` are the phase's own verify
    # assertions — the same lines the task contracts' `doneWhen` carry.
    - id: m01
      uses: orun.task/ensure@v1
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 01-scaffold
        exitCriteria:
          - repository created under {{ .inputs.githuborg }} and linked to the workspace
          - the scaffold merged, main pinned as the default branch
    - id: m02
      uses: orun.task/ensure@v1
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 02-foundation
        exitCriteria:
          - the thirteen shared packages on main, their verify lanes green
          - D1 and KV applied on stage and prod
          - WIRING_CLOUDFLARE_D1 and WIRING_CLOUDFLARE_KV published on stage and prod
    - id: m04
      uses: orun.task/ensure@v1
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 04-workers
        exitCriteria:
          - migrations applied and all twelve workers converged on stage and prod, first wave without bindings
    - id: m05
      uses: orun.task/ensure@v1
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 05-edge
        exitCriteria:
          - every service binding restored and the fleet converged again with them
          - api-edge /health answers 200 on stage and prod
          - the console root answers on stage and prod
    - id: m07
      uses: orun.task/ensure@v1
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 07-domain
        exitCriteria:
          - the custom-domain component merged and its convergence green
          - runs only when the build asks for a domain; otherwise it stays open and is skipped
    - id: m08
      uses: orun.task/ensure@v1
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 08-docs
        exitCriteria:
          - ai/context/deployment.md on main matches the probed live URLs
    # Tasks, one per landing, each under its milestone with the contract that
    # says what finishing it means. The titles are the ones each phase's own
    # `task` hook names, verbatim — that is the identity they are found by.
    - id: t01
      uses: orun.task/ensure@v1
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 01-scaffold
        name: "Scaffold the product repository"
        brief: >-
          Create {{ .inputs.githuborg }}/{{ .inputs.reponame }} and land its
          foundations as the first pull request: the intent, CI, tooling and
          the identity every later phase reads back, branded as
          {{ .inputs.productname }}.
        prefix: BASE
        contract: tasks/01-scaffold.TaskContract.yaml
    - id: t02
      uses: orun.task/ensure@v1
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 02-foundation
        name: "Publish the shared packages and provision the data plane"
        brief: >-
          Land the thirteen packages every worker builds on — contracts, the
          database layer, the SDK, the policy engine and their tests — and,
          in the same convergence, apply a D1 database and a KV namespace per
          environment and publish their ids as the wiring secrets the
          workers read.
        prefix: BASE
        contract: tasks/02-foundation.TaskContract.yaml
    - id: t04
      uses: orun.task/ensure@v1
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 04-workers
        name: "Deploy the worker fleet"
        brief: >-
          Land the database migrations and the twelve-worker fleet with every
          worker-to-worker service binding stripped, so the whole fleet's
          first deploy runs as one wave on stage and prod.
        prefix: BASE
        contract: tasks/04-workers.TaskContract.yaml
    - id: t05
      uses: orun.task/ensure@v1
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 05-edge
        name: "Wire the fleet and deploy the API edge and the console"
        brief: >-
          Put back every service binding the fleet deployed without and
          redeploy it with them, and land the API edge and the Next.js
          console beside it — one landing, one convergence — then see the
          edge answer /health and the console answer on stage and prod.
        prefix: BASE
        contract: tasks/05-edge.TaskContract.yaml
    - id: t07
      uses: orun.task/ensure@v1
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 07-domain
        name: "Bind the custom domain"
        brief: >-
          Land the custom-domain component for {{ .inputs.productdomain }} —
          the zone and the console's custom domains. Its phase runs only when
          the build asks for a domain.
        prefix: BASE
        contract: tasks/07-domain.TaskContract.yaml
    - id: t08
      uses: orun.task/ensure@v1
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 08-docs
        name: "Record the live deployment"
        brief: >-
          Probe every live URL one last time and write the deployment record
          into the repository from what actually answered, not from what the
          blueprint intended.
        prefix: BASE
        contract: tasks/08-docs.TaskContract.yaml

# ── PHASES ────────────────────────────────────────────────────────────────
# A phase is orun's own barrier over the module DAG — and, since BE1, the
# whole of what a phase DOES. Each one declares what it is for a person
# (`title`), what to budget (`expectedMinutes`), what must already be true
# (`requires`), whether it runs at all (`when`), and the hooks that do its
# work around placement: `pre` before, `post` after, `await` for what is
# still converging when the hooks are done.
#
# THE ORDER HERE IS THE EXECUTION ORDER, and the numbered names are the same
# names the task plane's milestones carry. Before BE1 the two disagreed: this
# file declared `workspace` LAST and `tooling/blueprint/split-phases.py`
# re-mapped it to the folder `01-scaffold`, which runs FIRST. A mapping table
# inside a script is a fact nothing checks, and this is what it was hiding —
# `shared` declared `dependsOn: [bootstrap]`, a module that does not exist and
# never has. orun refuses that (`dependsOn unknown module`). The splitter
# never hit it because it PRUNED every cross-phase edge to make each slice
# parse, and a pruned edge to a module that is in no phase looks exactly like
# a pruned edge to a module in an earlier one.
#
# So the barrier law is what makes this reorder safe rather than cosmetic: a
# dependency may never point forward across a phase boundary, and orun
# refuses the blueprint if one does — where the splitter deleted the edge and
# carried on.
#
# One phase places NO modules. `08-docs` is hooks and nothing else: it records
# the live deployment. It is a phase because it is a separately landable unit
# of the bootstrap with its own task and its own PR — which is what a phase is
# here — not because it writes files.
#
# FEWER LANDINGS, SAME NAMES. A landing has a fixed cost however small it is
# (place, open a PR, check, merge, wait for the convergence to start), so work
# that does not depend on another landing's deploy shares one: 02-foundation
# carries the data plane that was 03-infrastructure, and 05-edge carries the
# binding restore and the console that were 04-workers-restore and
# 06-console. The surviving phases keep their names — they are the identities
# the task plane's milestones, the engine's events and `--phase` all meet on —
# so the numbering has gaps where a phase was folded into its neighbour.
phases:
  - name: 01-scaffold
    title: The repo is born
    description: Root manifests, tooling, compositions, and the rebrand values file.
    expectedMinutes: 2
    narrate:
      start:  "Creating the repository and writing its foundations — intent, CI, tooling, and the identity every later phase reads back. About {{ .meta.expectedMinutes }} minutes."
      await:  "Waiting for the first push to settle on main."
      done:   "{{ .inputs.reponame }} exists on GitHub with {{ .meta.files }} files on main, branded as {{ .inputs.productname }}. That took {{ .meta.elapsed }}."
      failed: "The repository did not get off the ground. The log above says where it stopped."
    modules: [ai-deployment, ai-operations, discovery-roots, github-workflows, rebrand-values, root-gitignore, root-intent, root-kiox, root-kiox-lock, root-package-json, root-pnpm-lock, root-pnpm-workspace, root-readme, root-turbo, tooling-eslint, tooling-tsconfig, tooling-wire, vscode]
    # THE PLATFORM MUST BE ABLE TO SEE THE REPOSITORY BEFORE IT EXISTS. Every
    # phase lands a pull request that files under its task, and the platform
    # learns of a PR only through the GitHub App installation on the account
    # that OWNS the repository. A workspace connected to some other account
    # passed "github is connected", and every PR of the product it built was
    # invisible to it — no PR rows, nothing filed — found on
    # sourceplane/altocumulus, whose workspace was connected only to the user
    # account `adampullely`. So the owner's connection is asked for here,
    # before a repository is created, and waited for like any other consent.
    requires:
      probe:
        - id: github
          uses: orun.doctor/check@v1
          with:
            providers: [github]
            githubOwner: "{{ .inputs.githuborg }}"
            waitSeconds: 600
            pollSeconds: 20
    hooks:
      pre:
        # The epic, every milestone and every task already exist — the
        # run-level `hooks.preInstantiate` list above opened them before this
        # phase began. Each phase's own `task` hook is the same find-or-create
        # by title within the epic, so it FINDS the task and yields its key,
        # which the landing below binds the pull request to. (Under an orun
        # older than v2.60, which has no run-level pre list, this hook is what
        # creates the task — same identity, same result, one phase late.)
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Scaffold the product repository"
            prefix: BASE
            contract: tasks/01-scaffold.TaskContract.yaml
      # The identity chain, moved here from `hooks.postInstantiate`. It was
      # global because a one-shot instantiation has only one end; in a phased
      # bootstrap the end of 01-scaffold IS that moment — every later phase
      # applies into a tree that is already a git repo and already branded.
      #
      # rebrand.mjs enumerates the tree with `git ls-files`, so the output has
      # to be a git repo with a populated index BEFORE it runs. `git add -A`
      # only stages; nothing is committed here. The landing makes the commit.
      post:
        - id: git-init
          run: ["git", "init", "-q"]
        - id: git-stage
          run: ["git", "add", "-A"]
        - id: rebrand
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--values", ".rebrand/values.json", "--allow-dirty"]
        # Re-tenant the fork. rebrand.mjs classifies the orun state backend as
        # org-owned and deliberately leaves it untouched, so intent.yaml would
        # keep the BASELINE's `workspace:` — the fork's CI would then claim
        # another tenant's workspace on every remote op. Hook argv is not
        # templated, so the value travels through .rebrand/values.json, which
        # IS a rendered template.
        - id: orun-workspace
          run:
            - node
            - -e
            - |
              const fs = require("fs");
              const values = JSON.parse(fs.readFileSync(".rebrand/values.json", "utf8"));
              const ws = String(values.orunWorkspace || "").trim() || "ws_SET_ME";
              const before = fs.readFileSync("intent.yaml", "utf8");
              const after = before.replace(/^(\s*workspace:\s*).*$/m, "$1" + ws);
              if (after === before) {
                console.error("orun-workspace: no `workspace:` line in intent.yaml — refusing to guess");
                process.exit(1);
              }
              fs.writeFileSync("intent.yaml", after);
              console.log(
                ws === "ws_SET_ME"
                  ? "orun-workspace: wrote placeholder ws_SET_ME — set your Orun Cloud workspace before enabling remote state"
                  : "orun-workspace: intent.yaml workspace -> " + ws,
              );
        # STAGE AND PROD DEPLOY SIDE BY SIDE UNTIL THE BOOTSTRAP IS DONE.
        # intent.yaml gates prod behind stage (`promotion.dependsOn`), which
        # makes every prod deploy wait out the same component's stage deploy
        # and doubles each convergence. During a bootstrap both environments
        # are empty and every phase is watched to green before the next, so
        # the gate protects nothing yet: it is deferred here and restored by
        # 08-docs, the last landing. tooling/bootstrap/promotion.mjs.
        - id: promotion
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/promotion.mjs", "--defer"]
        # Re-stage so `git ls-files` and `rebrand --verify` see the rewritten tree.
        - id: git-restage
          run: ["git", "add", "-A"]
        - id: rebrand-verify
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--verify", "--values", ".rebrand/values.json"]
        - id: pnpm-lockfile
          run: ["pnpm", "install", "--lockfile-only"]
        # The repo has to exist before there is anywhere to land.
        - id: repo
          uses: orun.repo/ensure@v1
          narrate: "The repository exists at {{ .inputs.githuborg }}/{{ .inputs.reponame }}."
          with:
            owner: "{{ .inputs.githuborg }}"
            name: "{{ .inputs.reponame }}"
            private: "{{ .inputs.repoPrivate }}"
        # THE REPOSITORY MUST BE THE WORKSPACE'S before anything lands in it,
        # or the product's own CI cannot reach the platform. Every convergence
        # lane authenticates over GitHub OIDC, and the platform resolves that
        # token through the repo link. With no link, every lane of the first
        # real convergence died before running a step:
        #
        #   ✕ remote state auth (oidc exchange): OIDC exchange rejected:
        #     Not found (code: not_found)
        #
        # The shell this replaced ended 01-scaffold with exactly this pair (its
        # `link` step). BE4 kept the repo step and dropped the link, and
        # nothing noticed, because no BE4 run had reached a convergence.
        #
        # `link` may be refused where the credential cannot write links (a
        # workspace key) and the platform has linked the repository already —
        # a --via-platform build only builds into a linked one. So `link` is
        # best effort and `check` is the gate: an unlinked repository stops
        # here, naming the fix, instead of an hour later in every lane.
        - id: link
          run:
            - bash
            - -c
            - |
              orun cloud link --org "$1" || true
              orun cloud check --org "$1" || {
                echo "$2 is not linked to workspace $1 — its CI cannot authenticate. Link it (orun cloud link --org $1, or the console's Git Repos) and re-run this phase." >&2
                exit 1
              }
            - link
            - "{{ .inputs.orunWorkspace }}"
            - "{{ .inputs.githuborg }}/{{ .inputs.reponame }}"
        # EVERY PHASE IS A PULL REQUEST THAT IS CHECKED, THEN MERGED. No
        # landing below says `wait: false`: each waits for its PR's own CI —
        # the workflow run to its last job (orun >= v2.58.6) — and merges only
        # on green. But on a bootstrap branch (`orun/BASE-…`) that run is the
        # BASIC check only: `plan` resolves the intent, every component and
        # every composition, and the lanes are skipped
        # (.github/workflows/ci.yml), because the merge runs every one of them
        # on main a minute later, for real, and the convergence after each
        # merge is what this bootstrap watches to green before the next phase.
        # The PR pass was the same work twice and a third of the wall-clock.
        - id: land
          uses: orun.pr/land@v1
          narrate: "The first commit is merged into main."
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "feat(scaffold): the product repository, its CI and its identity"

  - name: 02-foundation
    title: The shared packages and the data plane
    expectedMinutes: 5
    narrate:
      start:  "Now the thirteen packages every worker builds on, and beside them the data layer — a D1 database and a KV namespace per environment. This is the first phase that touches Cloudflare. Usually about {{ .meta.expectedMinutes }} minutes."
      await:  "The packages are building and Terraform is applying D1 and KV. Both run in the same convergence."
      done:   "{{ .meta.files }} files are on main: the shared packages are built, and D1 and KV exist on stage and prod with their ids published for the workers. {{ .meta.elapsed }}."
      failed: "The packages or the data layer did not come up. The failing lane above names which, and a provider error is in its log."
    # TWO LANDINGS FOLDED INTO ONE. The packages and the data plane were
    # separate phases — 02-foundation and 03-infrastructure — each paying a
    # whole landing (place, PR, merge, a convergence of its own) for work that
    # never depended on the other: no package reads D1, and Terraform builds
    # none of the packages. One landing runs both in one convergence, side by
    # side.
    #
    # db-migrate is still NOT here, though it is data plane: it plans the
    # migrations against the database cloudflare-d1 creates, whose id is a
    # job-output secret that exists only once this phase's merge has applied.
    # It lands with 04-workers, the first phase that reads the database, where
    # the id already exists.
    modules: [cli, contracts, contracts-tests, db, db-tests, notifications-client, notifications-client-tests, policy-engine, policy-engine-tests, sdk, shared, testing, webhook-verifier, cloudflare-d1, cloudflare-kv]
    # The first phase that DEPLOYS. `requires.probe` asks reality the question
    # a lock file cannot answer: are the two provider connections live right
    # now? `docs/phases/04-workers.md` carries the same knowledge as
    # prose — "Lane fails resolving WIRING_*: phase 02 incomplete" — and prose
    # cannot gate anything.
    requires:
      phases: [01-scaffold]
      probe:
        - id: providers
          uses: orun.doctor/check@v1
          with:
            providers: [github, cloudflare]
            githubOwner: "{{ .inputs.githuborg }}"
            waitSeconds: 600
            pollSeconds: 20
    hooks:
      # Brokered, one hook per template: `integrations/reconcile` mints from
      # ONE connection with ONE scope template, and these three keys are three
      # different scopes on purpose — the deploy token deliberately cannot
      # touch D1. Collapsing them into one hook would be collapsing the scopes.
      # Keys that already exist are kept.
      pre:
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Publish the shared packages and provision the data plane"
            prefix: BASE
            contract: tasks/02-foundation.TaskContract.yaml
        - id: secret-workers-deploy
          uses: orun.integrations/reconcile@v1
          with:
            provider: cloudflare
            keys: [CLOUDFLARE_API_TOKEN]
            template: workers-deploy
        - id: secret-d1-edit
          uses: orun.integrations/reconcile@v1
          with:
            provider: cloudflare
            keys: [CLOUDFLARE_D1_TOKEN]
            template: d1-edit
        - id: secret-account-id
          uses: orun.integrations/reconcile@v1
          with:
            provider: cloudflare
            keys: [CLOUDFLARE_ACCOUNT_ID]
            template: account-id
      post:
        # A RE-RUN PHASE MUST HAVE SOMETHING TO LAND. A convergence can fail
        # AFTER its PR merged — a provider error, a starved runner pool, a
        # smoke that raced route propagation past its retries — and the merge
        # has already put every file this phase places on main. orun derives
        # phase state from the tree, so a retried build sees the phase placed,
        # and a forced re-run of it (`--phase`, `--redo` under `--resume`,
        # the console's Retry) lands an EMPTY diff, while the product's CI
        # plans `--changed` and deploys a component only when one of its
        # files changed in the push. Nothing lands, nothing redeploys, and
        # the operator is told the phase is fine.
        #
        # So before it stages, every phase that deploys components rewrites
        # ONE trailing line in each of their component.yaml files —
        # `# orun: redeploy <phase> <stamp>`, replaced rather than
        # accumulated (the fleet used to carry this as hand-edited `# ci:
        # re-trigger deploy` lines, duplicated by hand) — so the landing has a
        # diff and exactly the phase's components are in the changed set. The
        # components come from the phase's own task contract (`spec.affects`),
        # so the deploy set and the task plane's statement of the work are one
        # list. On a fresh run the files are new anyway and the line costs
        # nothing. THE MARKER IS A DEPLOY TRIGGER, NOT STATE: nothing reads it
        # back, and phase state stays derived from the tree, never stored in
        # it. tooling/bootstrap/retouch.mjs carries the full account.
        #
        # The terraform roots too: `orun plan --changed` plans a component by
        # its changed files whatever its type, and re-applying an unchanged
        # root is an empty plan, so a redo re-runs the lane that failed and
        # changes nothing that did not.
        - id: retouch
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/retouch.mjs", "--phase", "{{ .phase.name }}", "--affects", "{{ .baseline.dir }}/tasks/02-foundation.TaskContract.yaml"]
        # EVERY PHASE BRANDS WHAT IT PLACED, before it lands.
        #
        # orun writes a phase's files between its pre and post hooks (v2.58.5;
        # before that it wrote the WHOLE tree up front, and 01-scaffold landed
        # the entire product — 1075 files — as its first PR). So these files
        # arrive carrying the baseline's identity AFTER 01-scaffold's rebrand
        # has run, and landing them as placed would ship `cirrus-*` worker
        # names into the product. The shell this replaced did the same in
        # every phase (apply-blueprint.sh: place, stage, rebrand, stage).
        # rebrand.mjs enumerates the tree with `git ls-files`, hence the stage
        # before it; --verify then refuses a landing with identity left over.
        - id: stage
          run: ["git", "add", "-A"]
        - id: rebrand
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--values", ".rebrand/values.json", "--allow-dirty"]
        - id: restage
          run: ["git", "add", "-A"]
        - id: rebrand-verify
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--verify", "--values", ".rebrand/values.json"]
        # The workspace lockfile grows with the tree. 01-scaffold wrote it for
        # the three projects that existed then, and the lanes install with
        # --frozen-lockfile, so this phase's packages were refused before a
        # test ran: `ERR_PNPM_OUTDATED_LOCKFILE … not up to date with
        # packages/contracts/package.json`. The landing stages it.
        - id: pnpm-lockfile
          run: ["pnpm", "install", "--lockfile-only"]
        - id: land
          uses: orun.pr/land@v1
          narrate: "The packages and data-plane PR is merged into main."
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "feat(foundation): the shared packages, and D1 and KV on stage and prod"
      await:
        - id: converge
          uses: orun.run/watch@v1
          narrate: "The packages built, Terraform applied, and the convergence run came back green."
          with:
            # The run for the commit THIS landing merged, waited for. The
            # branch's newest run, read the moment the merge returns, is the
            # previous phase's — GitHub registers a push's run seconds later —
            # so an unpinned watch reported "converged" for a run that had not
            # started. And a wait of 0 parks the phase at once, which ends a
            # one-process bootstrap (the platform's driver included) at its
            # first convergence; the budget is roughly twice the phase's
            # expectedMinutes.
            sha: "{{ .phase.hooks.land.outputs.mergeSha }}"
            repo: "{{ .inputs.githuborg }}/{{ .inputs.reponame }}"
            resumeBudget: 3
            waitSeconds: 1800
        # WHERE THE WIRING IS PUBLISHED: each apply lease-publishes its outputs
        # to the project's ENVIRONMENT rungs (stage and prod), not to the
        # workspace. Read at the workspace rung, this parked with both keys
        # published on both environments — orunbase-demo/altocumulus, live.
        - id: verify
          uses: orun.secrets/exists@v1
          narrate: "The wiring secrets the workers read are published on stage and prod."
          with:
            keys: [WIRING_CLOUDFLARE_D1, WIRING_CLOUDFLARE_KV]
            project: "{{ .inputs.reponame }}"
            environments: [stage, prod]

  - name: 04-workers
    title: The worker fleet
    expectedMinutes: 8
    narrate:
      start:  "Now the database migrations and the twelve-worker fleet, the longest stretch of the build — usually about {{ .meta.expectedMinutes }} minutes. The workers call each other, so this first wave deploys every one of them without those bindings, all at once."
      await:  "Twelve workers are deploying across two environments, side by side. This is the slow part; nothing is stuck."
      done:   "All twelve workers are live on stage and prod, without the bindings between them — the next phase puts those back. {{ .meta.elapsed }}."
      failed: "The fleet did not deploy. The convergence log above names the worker that stopped it."
    modules: [db-migrate, admin-worker, admin-worker-tests, billing-worker, billing-worker-tests, config-worker, config-worker-tests, events-worker, events-worker-tests, identity-worker, identity-worker-tests, integrations-worker, integrations-worker-tests, membership-worker, membership-worker-tests, metering-worker, metering-worker-tests, notifications-worker, notifications-worker-tests, policy-worker, policy-worker-tests, projects-worker, projects-worker-tests, webhooks-worker, webhooks-worker-tests]
    requires:
      phases: [02-foundation]
      probe:
        - id: wiring
          uses: orun.secrets/exists@v1
          with:
            keys: [WIRING_CLOUDFLARE_D1, WIRING_CLOUDFLARE_KV]
            project: "{{ .inputs.reponame }}"
            environments: [stage, prod]
    hooks:
      pre:
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Deploy the worker fleet"
            prefix: BASE
            contract: tasks/04-workers.TaskContract.yaml
      post:
        # Give a re-run something to land (see 02-foundation).
        - id: retouch
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/retouch.mjs", "--phase", "{{ .phase.name }}", "--affects", "{{ .baseline.dir }}/tasks/04-workers.TaskContract.yaml"]
        # Brand what this phase placed before it lands (see 02-foundation).
        - id: stage
          run: ["git", "add", "-A"]
        - id: rebrand
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--values", ".rebrand/values.json", "--allow-dirty"]
        - id: restage
          run: ["git", "add", "-A"]
        - id: rebrand-verify
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--verify", "--values", ".rebrand/values.json"]
        - id: pnpm-lockfile
          run: ["pnpm", "install", "--lockfile-only"]
        # THE FLEET DEPLOYS IN ONE WAVE. A Cloudflare service binding cannot
        # name a worker that does not exist yet, and the workers bind to each
        # other — billing to policy, membership to billing, identity to
        # notifications, and a {billing, membership, events, notifications}
        # cycle on top. Deployed with their bindings, they had to go in
        # dependency order: a six-deep chain of deploys on stage and again on
        # prod, half the bootstrap's wall-clock.
        #
        # So the first deploy carries NO worker-to-worker binding at all
        # (`--strip --all`), and the peer edges in each component.yaml are
        # `dependencyMode: advisory` — nothing waits for anything but its
        # migration — so all twelve deploy at once. 05-edge restores every
        # binding and redeploys the fleet in a second wave, when every target
        # exists. That is still two deploys of the fleet; it is no longer two
        # dozen in a row.
        #
        # These edges are NOT in the module DAG — the bindings live in the
        # wrangler config a deploy reads, not in the placement order, so orun
        # never sees them. That is why cycle-break.mjs survives: it is a
        # deploy-time edit to a file, not an ordering orun's DAG could absorb.
        - id: strip
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/cycle-break.mjs", "--strip", "--all"]
        - id: land
          uses: orun.pr/land@v1
          narrate: "The fleet PR is merged into main."
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "feat(workers): the migrations and the twelve-worker fleet, first wave without bindings"
      await:
        - id: converge
          uses: orun.run/watch@v1
          narrate: "Twelve workers deployed and the convergence run came back green."
          with:
            sha: "{{ .phase.hooks.land.outputs.mergeSha }}"
            repo: "{{ .inputs.githuborg }}/{{ .inputs.reponame }}"
            resumeBudget: 3
            waitSeconds: 2400

  # THE SECOND WAVE, THE EDGE AND THE CONSOLE — ONE LANDING. Three phases used
  # to land here one after another: 04-workers-restore (the bindings back),
  # 05-edge, 06-console. None of them waits on another's DEPLOY: every worker
  # a binding names already exists after 04-workers, the edge binds only to
  # those workers, and the console reaches the edge by URL. So they land as
  # one pull request and converge in one run, side by side, and the bootstrap
  # pays one landing for them instead of three.
  #
  # The restore could not be a `post` hook of 04-workers — a binding may not
  # name a worker that is not deployed, and `post` hooks all run before
  # `await` — so it rides the NEXT landing, which is this one.
  - name: 05-edge
    title: The bindings, the API edge and the console
    expectedMinutes: 9
    narrate:
      start:  "Now the second wave: every worker gets its service bindings back, the API edge goes up in front of the fleet, and the web console beside it. One landing, one convergence; budget about {{ .meta.expectedMinutes }} minutes — the console build is the long pole."
      await:  "The fleet is redeploying with its bindings while the edge and the console deploy. The console build is the long pole; nothing is stuck."
      done:   "The fleet is wired the way the blueprint describes it, and the edge and the console are live on stage and prod. {{ .meta.elapsed }}."
      failed: "The second wave did not come up. The failing lane above names the worker, the edge or the console; the workers from the first wave are still deployed."
    modules: [api-edge, api-edge-tests, web-console-next, web-console-next-tests]
    requires:
      phases: [04-workers]
    hooks:
      pre:
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Wire the fleet and deploy the API edge and the console"
            prefix: BASE
            contract: tasks/05-edge.TaskContract.yaml
      post:
        # Give a re-run something to land (see 02-foundation). The contract's
        # `affects` names the edge, the console AND every worker that binds to
        # another: on a fresh run the restored templates change those workers
        # anyway, but a redo after a failed convergence finds the bindings
        # already restored (the restore is a no-op), and the marker is what
        # makes them redeploy with them.
        - id: retouch
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/retouch.mjs", "--phase", "{{ .phase.name }}", "--affects", "{{ .baseline.dir }}/tasks/05-edge.TaskContract.yaml"]
        # Put back every binding 04-workers stripped. The markers carry the
        # exact text removed — already branded, since 04 stripped after its
        # rebrand — so this is byte-for-byte the template 04 placed.
        - id: restore
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/cycle-break.mjs", "--restore"]
        # Brand what this phase placed before it lands (see 02-foundation).
        - id: stage
          run: ["git", "add", "-A"]
        - id: rebrand
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--values", ".rebrand/values.json", "--allow-dirty"]
        - id: restage
          run: ["git", "add", "-A"]
        - id: rebrand-verify
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--verify", "--values", ".rebrand/values.json"]
        - id: pnpm-lockfile
          run: ["pnpm", "install", "--lockfile-only"]
        - id: land
          uses: orun.pr/land@v1
          narrate: "The second-wave PR is merged into main."
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "feat(edge): the fleet's bindings, the API edge and the web console"
      await:
        - id: converge
          uses: orun.run/watch@v1
          narrate: "The fleet, the edge and the console deployed and the convergence run came back green."
          with:
            sha: "{{ .phase.hooks.land.outputs.mergeSha }}"
            repo: "{{ .inputs.githuborg }}/{{ .inputs.reponame }}"
            resumeBudget: 3
            waitSeconds: 2700
        - id: verify
          uses: orun.http/probe@v1
          narrate: "Every console and edge URL answered."
          with:
            urls:
              - "https://{{ .inputs.reponame }}-api-edge-stage.{{ .inputs.subdomain }}.workers.dev/health"
              - "https://{{ .inputs.reponame }}-web-console-next-stage.{{ .inputs.subdomain }}.workers.dev"
              - "https://{{ .inputs.reponame }}-api-edge-prod.{{ .inputs.subdomain }}.workers.dev/health"
              - "https://{{ .inputs.reponame }}-web-console-next-prod.{{ .inputs.subdomain }}.workers.dev"

  # cloudflare-domain trails the console because it wires the DEPLOYED
  # console's custom domain. `when:` is the condition the umbrella carried as
  # `[ "{{ inputs.domain }}" = "true" ]` in shell — a phase that declares when
  # it runs beats a caller remembering not to ask for it.
  - name: 07-domain
    title: The custom domain
    expectedMinutes: 5
    narrate:
      start:  "Now placing the custom-domain component for {{ .inputs.productdomain }} — the zone and the console's custom domains."
      await:  "Waiting for the convergence run that follows the domain PR."
      done:   "The custom-domain component is in the repository. It subscribes to no environment yet, so nothing is attached until it does — docs/phases/07-domain.md says what to change."
      failed: "The domain phase did not land. Check that the zone for {{ .inputs.productdomain }} exists in this Cloudflare account."
    modules: [cloudflare-domain]
    when: inputs.domain
    requires:
      phases: [05-edge]
    hooks:
      pre:
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Bind the custom domain"
            prefix: BASE
            contract: tasks/07-domain.TaskContract.yaml
      post:
        # Give a re-run something to land (see 02-foundation).
        # cloudflare-domain ships with `subscribe.environments: []`, so today
        # its convergence plans no lane and the marker changes nothing; once
        # an operator subscribes it (docs/phases/07-domain.md) a redo of this
        # phase has to re-plan it, and the marker is how.
        - id: retouch
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/retouch.mjs", "--phase", "{{ .phase.name }}", "--affects", "{{ .baseline.dir }}/tasks/07-domain.TaskContract.yaml"]
        # Brand what this phase placed before it lands (see 02-foundation).
        - id: stage
          run: ["git", "add", "-A"]
        - id: rebrand
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--values", ".rebrand/values.json", "--allow-dirty"]
        - id: restage
          run: ["git", "add", "-A"]
        - id: rebrand-verify
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--verify", "--values", ".rebrand/values.json"]
        - id: pnpm-lockfile
          run: ["pnpm", "install", "--lockfile-only"]
        - id: land
          uses: orun.pr/land@v1
          narrate: "The domain PR is merged into main."
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "feat(domain): the custom-domain component"
      await:
        - id: converge
          uses: orun.run/watch@v1
          narrate: "The convergence run after the domain PR came back green."
          with:
            sha: "{{ .phase.hooks.land.outputs.mergeSha }}"
            repo: "{{ .inputs.githuborg }}/{{ .inputs.reponame }}"
            resumeBudget: 3
            waitSeconds: 1800

  # Places nothing. It records what the other phases built, from PROBED facts
  # rather than from what the blueprint intended — which is why it runs last
  # and why its verify is the same probe 05-edge ends on.
  - name: 08-docs
    title: The deployment, recorded
    expectedMinutes: 1
    narrate:
      start:  "Now recording what was actually built — probing every URL and writing the deployment manifest into the repository."
      await:  "Probing the live endpoints one last time."
      done:   "ai/context/deployment.md now records the live deployment, written from probed facts rather than from what the blueprint intended."
      failed: "The deployment record did not land. Everything built is still there; only the write-up is missing."
    modules: []
    requires:
      phases: [05-edge]
    hooks:
      pre:
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Record the live deployment"
            prefix: BASE
            contract: tasks/08-docs.TaskContract.yaml
      post:
        # THE PRODUCT GOES LIVE WITH ITS PROMOTION GATE. 01-scaffold deferred
        # `prod.promotion.dependsOn: [stage]` so every bootstrap convergence
        # deployed both environments side by side; this, the last landing,
        # puts it back, and from here on a change reaches prod only after it
        # deployed to stage. Restoring touches only intent.yaml's
        # `environments` section, which `orun plan --changed` maps to no
        # component, so this landing redeploys nothing.
        - id: promotion
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/promotion.mjs", "--restore"]
        - id: render
          run: ["bash", "{{ .baseline.dir }}/hooks/render-deployment-docs.sh", ".", "{{ .inputs.orunWorkspace }}", "{{ .baseline.dir }}"]
        - id: land
          uses: orun.pr/land@v1
          narrate: "The deployment record is merged into main."
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "docs(deployment): record the live deployment state"
      await:
        - id: verify
          uses: orun.http/probe@v1
          narrate: "Every live URL answered on the final probe."
          with:
            urls:
              - "https://{{ .inputs.reponame }}-api-edge-stage.{{ .inputs.subdomain }}.workers.dev/health"
              - "https://{{ .inputs.reponame }}-web-console-next-stage.{{ .inputs.subdomain }}.workers.dev"
              - "https://{{ .inputs.reponame }}-api-edge-prod.{{ .inputs.subdomain }}.workers.dev/health"
              - "https://{{ .inputs.reponame }}-web-console-next-prod.{{ .inputs.subdomain }}.workers.dev"
