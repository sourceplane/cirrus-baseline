apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: policy-worker
  description: Cloudflare Worker for policy authorization decisions
spec:
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  domain: starter-runtime
  path: apps/policy-worker
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    # BF6: identity/role inputs for the deploy lane's wire-credentials step.
    # Inert until this worker gets a wrangler template (fleet rollout, BF6b).
    orgName: sourceplane
    owner: sourceplane
    repo: cirrus-baseline

    turboFilter: "@saas/policy-worker"
    wranglerConfig: wrangler.jsonc
    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/policy-worker
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/policy-worker
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    # The fleet's binding targets exist before any of it deploys: every worker
    # that holds a service binding waits on this one (an enforced dependsOn on
    # main), and this step uploads a placeholder for each target that does not
    # exist yet, so their first deploys carry their full bindings
    # (tooling/deploy/fleet-stubs.mjs). On a live product it uploads nothing.
    preDeployCommand: "node ../../tooling/deploy/fleet-stubs.mjs --root ../.."
    migrationCommand: "echo 'No migrations configured.'"
    smokeCommand: "echo 'No smoke test configured.'"
  labels:
    team: platform
    layer: runtime
    surface: policy
    runtime: cloudflare
